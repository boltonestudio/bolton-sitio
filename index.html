<style>
/* VOICE: minimal, editorial, blanco y negro; la obra pone el color.
   IDEA: la referencia Jetton: catálogo claro, títulos condensados enormes y fichas en monoespaciada.
   PICTURE: las láminas de cada proyecto, que aparecen tras una grilla de celdas ASCII.
   COLOUR/TYPE: fondo #f7f7f7, tinta #000, gris #b8b8b8. Cossette Titre (títulos) + DM Mono 500 (todo lo demás, en mayúsculas).
   LAYOUT: header fijo transparente, márgenes de 3vw, grilla de 12 columnas con tarjetas asimétricas. */
:root{color-scheme:light;--bg:#f7f7f7;--bg2:#0e0e0e;--ink:#000;--mute:#b8b8b8;--soft:#6b6b6b;--line:#e1e1e1;--bg3:#ececec;--disp:"Cossette Titre","Oswald","Arial Narrow",sans-serif;--mono:"DM Mono",ui-monospace,monospace;--pad:clamp(18px,2.93vw,56px);--hh:100px;--ease:cubic-bezier(.76,0,.24,1)}
*{box-sizing:border-box;min-width:0}
/* modos: claro (por defecto), oscuro y flúor */
:root[data-mode=dark]{color-scheme:dark;--bg:#0b0b0b;--bg2:#161616;--ink:#f2f2f2;--mute:#4a4a4a;--soft:#9a9a9a;--line:#262626;--bg3:#181818}
:root[data-mode=fluor]{--bg:#d9ff3f;--bg2:#0e0e0e;--ink:#000;--mute:#00000059;--soft:#00000099;--line:#00000026;--bg3:#0000000f}
html{scroll-padding-top:140px;background:var(--bg)}
body,.fbar{transition:background-color .5s,color .5s}
html.lenis,html.lenis body{height:auto}.lenis.lenis-smooth{scroll-behavior:auto!important}.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/20px var(--mono);letter-spacing:-.005em;text-transform:uppercase;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
::selection{background:var(--ink);color:var(--bg)}
.disp{font-family:var(--disp);font-weight:400;text-transform:uppercase;line-height:1;letter-spacing:-.02em;margin:0}
.lab{font:500 16px/20px var(--mono);letter-spacing:-.005em;text-transform:uppercase}
.mute{color:var(--soft)}
.pend{display:inline-block;font:500 11px/1 var(--mono);text-transform:uppercase;color:#a66a00;border:1px dashed #d6a24a;padding:4px 6px;border-radius:3px;vertical-align:middle;white-space:nowrap}
body.no-pend .pend{display:none}
.line{display:block;overflow:hidden;padding-bottom:.02em}.line>span{display:block}
.ch{display:inline-block;will-change:transform}

/* header */
.hd{position:fixed;inset:0 0 auto;height:var(--hh);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 var(--pad);z-index:60;color:#fff;mix-blend-mode:difference}
.logo{display:flex;align-items:center;gap:12px;min-height:44px}
.bmark{width:28px;height:32px;display:block;overflow:visible}
.nav{display:flex;gap:30px}
.nav a{position:relative;padding:12px 0}
.nav a::after{content:"";position:absolute;left:0;right:100%;bottom:9px;height:1.5px;background:currentColor;transition:right .5s var(--ease)}
.nav a:hover::after,.nav a.on::after{right:0}
.mbtn{display:flex;align-items:center;gap:16px;min-height:44px}
.hd-r{display:flex;align-items:center;gap:clamp(18px,2.5vw,40px)}
.clock{white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:640px){.clock{display:none}}
.mode{display:flex;align-items:center;gap:10px;min-height:44px}
.mode i{width:14px;height:14px;border-radius:50%;border:1.5px solid currentColor;display:block;background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
:root[data-mode=fluor] .hd{color:#000;mix-blend-mode:normal}
:root[data-mode=fluor] body.hd-light .hd{color:#fff}
:root[data-mode=fluor] .mode i{background:#d9ff3f;border-color:#000}
:root[data-mode=fluor] .cur{background:#000;mix-blend-mode:normal}
:root[data-mode=fluor] .cur.link{background:transparent;box-shadow:inset 0 0 0 1.5px #000}
.dots{position:relative;width:21px;height:21px}
.dots b{position:absolute;top:50%;width:5px;height:5px;margin-top:-2.5px;background:currentColor;border-radius:50%;transition:all .5s var(--ease)}
.dots b:nth-child(1){left:0}.dots b:nth-child(2){left:8px}.dots b:nth-child(3){left:16px}
.menu-open .dots b{width:21px;height:2px;left:0;border-radius:0;margin-top:-1px}
.menu-open .dots b:nth-child(1){transform:rotate(45deg)}.menu-open .dots b:nth-child(3){transform:rotate(-45deg)}.menu-open .dots b:nth-child(2){opacity:0}

/* menu overlay */
.ov{position:fixed;inset:0;background:var(--bg2);color:#fff;z-index:55;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:56px;clip-path:inset(0 0 100% 0);visibility:hidden}
.menu-open .ov{visibility:visible}
.ov nav{display:flex;flex-direction:column;align-items:center}
.ov nav a{font-size:clamp(48px,6.34vw,120px);line-height:1.05;transition:opacity .4s}
.ov nav:hover a{opacity:.3}.ov nav a:hover{opacity:1}
.pill{display:inline-flex;align-items:center;height:34px;padding:0 14px;border-radius:4px;background:#fff;color:#000}
.ov .ovf{position:absolute;bottom:30px;left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:#8a8a8a}

/* veil + preloader */
.veil{position:fixed;inset:0;background:var(--bg2);z-index:80;transform:translateY(100%);visibility:hidden;display:grid;place-items:center;pointer-events:none;color:#fff}
.veil .disp{font-size:clamp(48px,6.34vw,120px)}
.pre{position:fixed;inset:0;background:var(--bg);z-index:90;box-shadow:0 1px 0 var(--ink),0 18px 40px -18px #0000002e}
.pre canvas{position:absolute;inset:0;width:100%;height:100%}
.pre .pmark{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink);z-index:2;pointer-events:none}.pre .pmark .bmark{width:clamp(120px,19vmin,230px);height:auto;aspect-ratio:615/695;opacity:0}
.pre .hint{position:absolute;bottom:30px;right:var(--pad);color:#8a8a8a;z-index:2}
.pre .cnt{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:var(--ink);z-index:2}
.flyer{position:fixed;z-index:95;color:var(--ink);pointer-events:none}.flyer .bmark{width:100%;height:100%;display:block}
.no-js-anim .pre{display:none}

/* cursor */
.cur{opacity:0;position:fixed;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;-webkit-mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3Cmask%20id%3D%22m%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23fff%22/%3E%3Cg%20stroke%3D%22%23000%22%20stroke-width%3D%2210%22%3E%3Cpath%20d%3D%22M24%2050H76%22/%3E%3Cpath%20d%3D%22M37%2027.5L63%2072.5%22/%3E%3Cpath%20d%3D%22M63%2027.5L37%2072.5%22/%3E%3C/g%3E%3C/mask%3E%3C/defs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2250%22%20fill%3D%22%23fff%22%20mask%3D%22url%28%23m%29%22/%3E%3C/svg%3E") center/100% 100% no-repeat;mask:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Cdefs%3E%3Cmask%20id%3D%22m%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20fill%3D%22%23fff%22/%3E%3Cg%20stroke%3D%22%23000%22%20stroke-width%3D%2210%22%3E%3Cpath%20d%3D%22M24%2050H76%22/%3E%3Cpath%20d%3D%22M37%2027.5L63%2072.5%22/%3E%3Cpath%20d%3D%22M63%2027.5L37%2072.5%22/%3E%3C/g%3E%3C/mask%3E%3C/defs%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2250%22%20fill%3D%22%23fff%22%20mask%3D%22url%28%23m%29%22/%3E%3C/svg%3E") center/100% 100% no-repeat;background:#fff;mix-blend-mode:difference;pointer-events:none;z-index:100;display:grid;place-items:center;color:#fff;transition:width .35s var(--ease),height .35s var(--ease),margin .35s var(--ease),border-radius .35s var(--ease),background .3s}
.cur span{font:500 18px/1 var(--mono);opacity:0;transition:opacity .2s}
.cur.big,.cur.link{-webkit-mask:none;mask:none}
.cur.big{width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:3px;background:#000;mix-blend-mode:normal}.cur.big span{opacity:1}
.cur.link{width:26px;height:26px;margin:-13px 0 0 -13px;background:transparent;box-shadow:inset 0 0 0 1.5px #fff}
.cur.on{opacity:1}
@media (hover:none){.cur{display:none}}
@media (hover:hover){body.has-cur,body.has-cur a,body.has-cur button{cursor:none}}

/* layout */
main{min-height:100vh}
.band{padding:clamp(64px,9vw,150px) var(--pad)}
.hero{padding:160px var(--pad) 0}
.hero h1{font-size:clamp(54px,9.875vw,200px)}
.hero .sub{margin:clamp(48px,9vh,100px) 0 0;display:grid;gap:30px}
.hero .sub p{margin:0;max-width:72ch}
.hero.home{min-height:100svh;display:flex;flex-direction:column;padding-bottom:30px}
.hero.home .sub{margin-top:auto;grid-template-columns:minmax(0,1fr) auto;align-items:end;padding-top:48px}
.stx{display:flex;align-items:center;gap:22px;white-space:nowrap;min-height:44px}
.stx svg{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}

/* filter bar */
.fbar{position:sticky;top:calc(var(--hh) - 26px);z-index:20;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:56px 0 0;padding:0 var(--pad);height:76px;border-top:1px solid var(--line)}
.fbar .tg{display:flex;align-items:center;gap:22px;min-height:44px;justify-self:center}
.fbar .vw{display:flex;gap:36px;justify-self:end}
.vw button{display:flex;gap:28px;align-items:center;min-height:44px;color:var(--mute);transition:color .3s}.vw button.on{color:var(--ink)}
.fpanel{overflow:hidden;height:0;padding:0 var(--pad)}
.fpanel .fl{display:flex;flex-wrap:wrap;gap:0 .25em;padding:24px 0 40px;font-size:clamp(30px,3.72vw,72px);line-height:1.1}
.fl button{color:var(--mute);transition:color .3s;display:inline-flex;align-items:baseline}
.fl button:hover,.fl button.on{color:var(--ink)}
.fl sup{font:500 12px var(--mono);margin-left:4px;vertical-align:super}
.fl .w{display:inline-block;overflow:hidden}

/* grid */
.works{padding:clamp(48px,6vw,90px) var(--pad) clamp(80px,10vw,160px)}
.grid,.home-works{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--pad);row-gap:clamp(80px,12vw,200px);align-items:start}
.card{display:block}
.card.l0{grid-column:1/4}.card.l1{grid-column:7/13}.card.l2{grid-column:3/6}.card.l3{grid-column:6/9}.card.l4{grid-column:1/7}.card.l5{grid-column:10/13}
.card h3{font-size:clamp(24px,2.93vw,56px);line-height:1.1;letter-spacing:-.003em;margin-bottom:17px}
.media{position:relative;overflow:hidden;aspect-ratio:var(--r,4/5);background:var(--bg3)}
.media-in{position:absolute;inset:-7% 0;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.card:hover .media-in{transform:scale(1.05)}
.meta{display:flex;justify-content:space-between;gap:12px;margin-top:10px;line-height:30px}
.ascii{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}

/* placeholder image */
.ph{position:absolute;inset:0;background:var(--bg3);display:flex;flex-direction:column;justify-content:space-between;padding:7% 6%;overflow:hidden}
.ph .pw{font-family:var(--disp);text-transform:uppercase;font-size:clamp(40px,7vw,120px);line-height:.9;color:var(--ink);opacity:.06;overflow-wrap:anywhere}

/* list view */
.list{display:none}
.is-list .grid{display:none}.is-list .list{display:block}
.row{display:grid;grid-template-columns:3.2em minmax(0,1.4fr) minmax(0,1fr) 5em;gap:16px;align-items:center;min-height:64px;transition:color .3s}
.row .ry{text-align:right}
.list:hover .row{color:var(--mute)}.list .row:hover{color:var(--ink)}
.lp{position:fixed;left:0;top:0;width:240px;aspect-ratio:4/5;pointer-events:none;z-index:30;opacity:0;overflow:hidden;transform:translate(-50%,-50%) scale(.85);transition:opacity .3s,transform .45s var(--ease)}
.lp.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (hover:none){.lp{display:none}}
.empty{display:none;padding:10vh 0;max-width:52ch}
.empty.on{display:block}

/* sections */
.big-p{font-family:var(--disp);text-transform:uppercase;font-size:clamp(30px,3.72vw,72px);line-height:1.05;letter-spacing:-.02em;max-width:22ch;margin:0;text-wrap:balance}
.txt{text-transform:none;font-size:16px;line-height:1.5;max-width:60ch}
.split{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,8fr);gap:var(--pad);align-items:start}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:clamp(40px,6vw,90px)}
.sec-h .disp{font-size:clamp(48px,6.34vw,120px)}
.rows>div{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,2fr) auto;gap:16px;padding:22px 0;border-top:1px solid var(--line);align-items:baseline}
.rows .disp{font-size:clamp(26px,2.93vw,56px)}
.svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));column-gap:var(--pad)}
.svc div{padding:24px 0 34px;border-top:1px solid var(--line)}
.svc .disp{font-size:clamp(28px,2.93vw,56px);display:block;margin-top:14px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tags span{border:1px solid var(--ink);border-radius:4px;padding:10px 14px}
.cta{display:block;padding:clamp(80px,12vw,200px) var(--pad);border-top:1px solid var(--line)}
.cta .disp{font-size:clamp(80px,17vw,320px);transition:letter-spacing .7s cubic-bezier(.2,.7,.2,1)}
.cta:hover .disp{letter-spacing:0}

/* home: destacados a pantalla completa */
.feat{position:relative}
.slide{position:sticky;top:0;display:block;height:100svh;overflow:hidden;color:#fff;background:#111}
.slide-img{position:absolute;inset:0}
.slide-img img{transform:scale(1.04);filter:grayscale(1) contrast(1.08) brightness(.55);transition:filter .8s,transform 1.2s cubic-bezier(.2,.7,.2,1)}
.slide:hover .slide-img img{filter:grayscale(1) contrast(1.08) brightness(.68);transform:scale(1.07)}
.slide::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 45% at 50% 50%,#0007,#0000 70%),linear-gradient(#0000 60%,#0008);pointer-events:none;z-index:2}
.slide-t{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(48px,6.34vw,140px);z-index:3;padding:0 var(--pad)}
.slide-b{position:absolute;left:var(--pad);right:var(--pad);bottom:30px;display:flex;justify-content:space-between;z-index:3}
.allw{display:grid;place-items:center;padding:clamp(56px,7vw,110px) var(--pad);border-bottom:1px solid var(--line)}
.allw a{font-size:clamp(30px,3.72vw,72px);line-height:1.1;border-bottom:3px solid currentColor;padding-bottom:2px}
.ul{border-bottom:1.5px solid currentColor;padding-bottom:2px}
/* home: frase grande con palabras repartidas */
.stmt{padding:clamp(100px,14vw,240px) var(--pad) clamp(80px,9vw,160px)}
.stmt-t{font-size:clamp(46px,9.875vw,200px);line-height:1.04}
.sl{display:flex;justify-content:center;white-space:nowrap}
.sw{flex:0 1 auto;flex-grow:0}.sw:first-child{padding-right:.28em}
.stmt-c{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--pad);width:min(100%,50%);margin:clamp(80px,9vw,150px) 0 0 auto}
.stmt-c p{margin:0}
/* project page */
.pj-hero{padding:160px var(--pad) 0}
.pj-hero h1{font-size:clamp(64px,13vw,260px)}
.pj-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;padding:30px 0;margin-top:56px;border-top:1px solid var(--line)}
.pj-meta div>*{display:block}.pj-meta .mute{margin-bottom:6px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--pad);padding:0 var(--pad)}
.gal .full{grid-column:1/-1}.gal .solo{grid-column:1/-1;width:min(100%,640px);justify-self:center}
.gal figure{margin:0}

/* footer */
.ft{border-top:1px solid var(--line);padding:clamp(56px,7vw,110px) var(--pad) 30px}
.ft-top{display:flex;justify-content:space-between;gap:16px;margin-bottom:24px}
.ft-top b{display:inline-block;width:10px;height:10px;background:currentColor;margin-right:12px;vertical-align:1px}
.ft-next{display:block;margin-bottom:clamp(64px,9vw,140px)}
.ft-next .disp{font-size:clamp(72px,13vw,260px);transition:transform .8s cubic-bezier(.2,.7,.2,1);display:inline-block}
.ft-next:hover .disp{transform:translateX(1.5vw)}
.ft-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
.ft-grid h4{margin:0 0 16px;font-weight:500}
.ft-grid p{text-transform:none;line-height:1.5}
.ft-grid ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ft-grid a{display:inline-block;padding:4px 0}
.ft-grid a:hover{color:var(--soft)}
.ft-bot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-top:72px}
.top{display:flex;align-items:center;gap:10px;min-height:44px}

@media (max-width:1000px){
  .nav{display:none}
  .split{grid-template-columns:1fr}
  .ft-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pj-meta{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card.l0,.card.l2,.card.l3,.card.l5{grid-column:span 6}.card.l1,.card.l4{grid-column:span 6}
}
@media (max-width:640px){
  .stmt-c{grid-template-columns:1fr;width:100%}.stmt-t{font-size:10.4vw}

  :root{--hh:76px}
  body,.lab{font-size:14px;line-height:18px}
  .hero,.pj-hero{padding-top:130px}
  .grid,.home-works{grid-template-columns:1fr;row-gap:64px}
  .card.l0,.card.l1,.card.l2,.card.l3,.card.l4,.card.l5{grid-column:1/-1}
  .fbar{grid-template-columns:auto 1fr;height:64px}
  .fbar .stx{display:none}
  .fbar .tg{justify-self:start}
  .vw{gap:18px}.vw button{gap:10px}
  .hero.home .sub{grid-template-columns:1fr}
  .row{grid-template-columns:2.4em minmax(0,1fr) 3.5em}
  .row .rc{display:none}

function splitChars(el){
  const t=el.textContent; el.innerHTML=[...t].map(c=>c===' '?' ':`<span class="ch">${esc(c)}</span>`).join('');
  return $$('.ch',el);
}
const ACH='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789#$%&*+?@!<>=';
const rch=()=>ACH[Math.random()*ACH.length|0];
function asciiCanvas(host,cls){
  const cv=document.createElement('canvas'); cv.className=cls||'ascii'; host.appendChild(cv);
  const ctx=cv.getContext('2d'), dpr=Math.min(2,devicePixelRatio||1);
  const o={cv,ctx,cell:18};
  o.size=()=>{const w=host.clientWidth,h=host.clientHeight;cv.width=Math.max(1,w*dpr);cv.height=Math.max(1,h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    o.w=w;o.h=h;o.cols=Math.ceil(w/o.cell);o.rows=Math.ceil(h/o.cell);o.n=o.cols*o.rows;o.ch=Array.from({length:o.n},rch);};
  o.size();
  o.cellDraw=(i,fill,txt)=>{const x=(i%o.cols)*o.cell,y=(i/o.cols|0)*o.cell;ctx.fillStyle=fill;ctx.fillRect(x,y,o.cell,o.cell);
    if(txt){ctx.fillStyle=txt;ctx.fillText(o.ch[i],x+o.cell/2,y+o.cell/2+.5);}};
  o.font=()=>{ctx.font='500 11px "DM Mono", monospace';ctx.textAlign='center';ctx.textBaseline='middle';};
  o.font();
  return o;
}
/* revela una imagen: celdas negras con caracteres que se apagan en la dirección del scroll.
   Antes de mostrar la foto, cada celda pasa por un cuadrado del color promedio de la imagen en ese punto.
   Se vuelve a tapar al salir de pantalla y se repite al entrar, bajando o subiendo. */
function asciiReveal(host){
  if(host._ascii) return; const o=asciiCanvas(host); host._ascii=o;
  let raf=0, cols=null;
  const fallback=getComputedStyle(document.documentElement).getPropertyValue('--bg3').trim()||'#ececec';
  const sample=()=>{const img=$('img',host); cols=new Array(o.n).fill(fallback);
    if(!img||!img.complete||!img.naturalWidth) return;
    try{const c2=document.createElement('canvas');c2.width=o.cols;c2.height=o.rows;const x=c2.getContext('2d');x.imageSmoothingQuality='high';
      const hr=host.getBoundingClientRect(), ir=img.getBoundingClientRect(), sc=1/o.cell;
      const dw=ir.width*sc, dh=ir.height*sc, k=Math.max(dw/img.naturalWidth,dh/img.naturalHeight), w=img.naturalWidth*k, h=img.naturalHeight*k;
      x.drawImage(img,(ir.left-hr.left)*sc+(dw-w)/2,(ir.top-hr.top)*sc+(dh-h)/2,w,h);
      const d=x.getImageData(0,0,o.cols,o.rows).data;
      for(let i=0;i<o.n;i++)cols[i]=`rgb(${d[i*4]},${d[i*4+1]},${d[i*4+2]})`;}catch(e){}};
  const cover=()=>{cancelAnimationFrame(raf);o.ctx.clearRect(0,0,o.w,o.h);for(let i=0;i<o.n;i++)o.cellDraw(i,'#000',Math.random()<.85?'#5c5c5c':null);host._shown=false;};
  const play=dir=>{cancelAnimationFrame(raf); if(host._shown) return; host._shown=true; sample();
    const th=new Array(o.n); for(let i=0;i<o.n;i++){const r=(i/o.cols|0)/Math.max(1,o.rows-1);th[i]=(dir>0?r:1-r)*.7+Math.random()*.3;}
    const dur=1150,t0=performance.now();
    const step=now=>{const p=(now-t0)/dur;o.ctx.clearRect(0,0,o.w,o.h);let left=0;
      for(let i=0;i<o.n;i++){const d=p-th[i];
        if(d<0){left++;if(Math.random()<.05)o.ch[i]=rch();o.cellDraw(i,'#000','#5c5c5c');}
        else if(d<.1){left++;o.cellDraw(i,cols[i],null);}}
      if(left)raf=requestAnimationFrame(step);};
    raf=requestAnimationFrame(step);};
  cover();
  const img=$('img',host); if(img&&!img.complete) img.addEventListener('load',()=>{},{once:true});
  if(ST){ST.create({trigger:host,start:'top 92%',end:'bottom 8%',
      onEnter:()=>play(1),onEnterBack:()=>play(-1),onLeave:cover,onLeaveBack:cover,
      onRefresh:()=>{o.size();if(!host._shown)cover();else o.ctx.clearRect(0,0,o.w,o.h);}});}
  else{const io=new IntersectionObserver(es=>{es[0].isIntersecting?play(1):cover();},{threshold:.1});io.observe(host);}
}
/* texto que se mezcla y se resuelve letra por letra */
/* guarda el texto original la primera vez, antes de cualquier mezcla */
const orig=el=>{if(el._orig===undefined)el._orig=el.textContent;return el._orig;};
function shuffle(el,to,dur=520){
  if(!el) return; orig(el); if(to===undefined) to=el._orig;
  clearInterval(el._sh); clearTimeout(el._st); const L=to.length; const t0=performance.now();
  const end=()=>{clearInterval(el._sh);clearTimeout(el._st);el.textContent=to;};
  el._sh=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/dur), k=Math.floor(p*L);
    el.textContent=to.slice(0,k)+[...to.slice(k)].map(c=>c===' '?' ':rch()).join('');
    if(p>=1)end();},32);
  el._st=setTimeout(end,dur+150); /* garantía: siempre termina en el texto correcto */
}
function animatePage(root){
  if(!ANIM||!ST) return;
  ST.getAll().forEach(t=>t.kill());
  $$('[data-hero] [data-split]',root).forEach((el,i)=>{
    const ch=splitChars(el);
    G.fromTo(ch,{yPercent:110},{yPercent:0,duration:1.1,ease:'expo.out',stagger:.025,delay:.15+i*.12});
  });
  $$('[data-mask]',root).forEach(asciiReveal);
  $$('.slide',root).forEach(sl=>ST.create({trigger:sl,start:'top 50px',end:'bottom 50px',toggleClass:{targets:document.body,className:'hd-light'}}));
  /* frase grande: el espacio entre las palabras de cada renglón se cierra y se abre con el scroll */
  $$('.stmt-t .sl',root).forEach(ln=>{const w=ln.firstElementChild, stretch=ln.dataset.mode==='stretch';
    ST.create({trigger:ln,start:stretch?'top bottom':'top 85%',end:stretch?'top 28%':'top 40%',scrub:.4,
      onUpdate:self=>{const p=self.progress;w.style.flexGrow=(stretch?Math.abs(1-2*p):1-p).toFixed(4);}});});
  $$('.slide-t',root).forEach(t=>{ST.create({trigger:t.parentElement,start:'top 60%',once:true,onEnter:()=>shuffle(t,orig(t),700)});});
  $$('.meta>span, .fbar .stx, .fbar #ftgT, .vw button',root).forEach(el=>{const t=el.firstChild&&el.firstChild.nodeType===3?el.firstChild:null;if(!t)return;
    const full=t.textContent;
    if(!el.childElementCount){orig(el);ST.create({trigger:el,start:'top 95%',once:true,onEnter:()=>shuffle(el,undefined,700)});return;}
    ST.create({trigger:el,start:'top 95%',once:true,onEnter:()=>{const sp=document.createElement('span');sp.textContent=full;sp._orig=full;t.replaceWith(sp);shuffle(sp,full,700);}});});
  $$('[data-par]',root).forEach(el=>G.fromTo(el,{yPercent:-5},{yPercent:5,ease:'none',scrollTrigger:{trigger:el.parentElement,start:'top bottom',end:'bottom top',scrub:true}}));
  $$('[data-rv], .card h3',root).forEach(el=>G.from(el,{y:50,opacity:0,duration:1.1,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 92%',once:true}}));
  $$('.ft-next .disp, .ft-grid>div').forEach(el=>G.from(el,{y:50,opacity:0,duration:1,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 95%',once:true}}));
  requestAnimationFrame(()=>ST.refresh());
}

function bindTrabajos(){
  const grid=$('#grid'), list=$('#list'), works=$('#lista'), panel=$('#fpanel'), tg=$('#ftg');
  if(!grid) return;
  let open=false, busy=false, view='grid';
  const relayout=()=>{let k=0;$$('.card',grid).forEach(c=>{if(c.style.display==='none')return;c.className='card l'+(k%6);$('.media',c).style.setProperty('--r',RATIOS[k%6]);k++;});};
  tg.onclick=()=>{
    open=!open; tg.setAttribute('aria-expanded',open); $('#ftgT').textContent=open?'Cerrar':'Categorías'; $('#ftgI').textContent=open?'×':'↕';
    const ws=$$('.fl .w>button');
    if(ANIM){ if(open){G.set(panel,{height:'auto'});G.from(panel,{height:0,duration:.6,ease:'power3.inOut'});G.fromTo(ws,{yPercent:110},{yPercent:0,duration:.8,ease:'expo.out',stagger:.04,delay:.1});}
      else G.to(panel,{height:0,duration:.55,ease:'power3.inOut',onComplete:()=>ST&&ST.refresh()}); }
    else panel.style.height=open?'auto':'0';
  };
  $$('#fl button').forEach(b=>b.onclick=()=>{
    if(busy||b.classList.contains('on')) return;
    $$('#fl button').forEach(x=>x.classList.toggle('on',x===b));
    const f=b.dataset.f, match=id=>{const p=P.find(x=>x.id===id);return f==='*'||p.cats.includes(f)};
    const items=[...$$('.card',grid),...$$('.row',list)];
    const apply=()=>{items.forEach(el=>el.style.display=match(el.dataset.id)?'':'none');relayout();
      const n=items.filter(el=>el.style.display!=='none').length; $('#empty').classList.toggle('on',n===0);};
    if(!ANIM){apply();return;}
    busy=true;
    const vis=items.filter(el=>el.style.display!=='none'&&el.offsetParent);
    G.to(vis,{opacity:0,y:30,duration:.35,stagger:.03,ease:'power2.in',onComplete:()=>{
      apply(); const now=items.filter(el=>el.style.display!=='none'&&el.offsetParent);
      G.fromTo(now,{opacity:0,y:40},{opacity:1,y:0,duration:.8,stagger:.06,ease:'power3.out',onComplete:()=>{busy=false;ST&&ST.refresh();}});
      if(!now.length){busy=false;G.fromTo('#empty',{opacity:0,y:20},{opacity:1,y:0,duration:.6});}
    }});
    if(vis.length===0) {apply();busy=false;}
  });
  $$('.vw button').forEach(b=>b.onclick=()=>{
    if(b.dataset.v===view) return; view=b.dataset.v;
    $$('.vw button').forEach(x=>x.classList.toggle('on',x===b));
    const swap=()=>{works.classList.toggle('is-list',view==='list');
      const t=view==='list'?$$('.row',list).filter(r=>r.style.display!=='none'):$$('.card',grid).filter(r=>r.style.display!=='none');
      if(ANIM){G.fromTo(t,{opacity:0,y:30},{opacity:1,y:0,duration:.7,stagger:.05,ease:'power3.out'});}
      ST&&ST.refresh();};
    if(ANIM) G.to(works,{opacity:0,duration:.3,onComplete:()=>{swap();G.to(works,{opacity:1,duration:.3});}}); else swap();
  });
  // vista previa flotante en la lista
  const lp=$('#lp');
  $$('.row',list).forEach(r=>{
    r.addEventListener('mouseenter',()=>{const p=P.find(x=>x.id===r.dataset.id);lp.innerHTML=ph(p,0);lp.classList.add('on');});
    r.addEventListener('mouseleave',()=>lp.classList.remove('on'));
  });
}

/* ===================== router + transiciones ===================== */
const ROUTES={inicio:vInicio,trabajos:vTrabajos,estudio:vEstudio,contacto:vContacto};
const TITLES={inicio:'Inicio',trabajos:'Trabajos',estudio:'Estudio',contacto:'Contacto'};
let current=null, moving=false, booting=ANIM;
function resolve(){
  const h=decodeURIComponent(location.hash.slice(1))||'inicio';
  if(ROUTES[h]) return {key:h,html:ROUTES[h](),foot:h,title:TITLES[h]};
  const p=P.find(x=>x.id===h); if(p) return {key:h,html:vProyecto(p),foot:null,title:p.name};
  const el=document.getElementById(h); if(el&&current) return {anchor:el};
  return {key:'inicio',html:vInicio(),foot:'inicio',title:'Inicio'};
}
function render(r){
  const v=$('#view'); v.innerHTML=r.html; footer(r.foot); current=r.key;
  document.title=`${r.title} — Bolton`;
  $$('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===r.key||(!ROUTES[r.key]&&a.dataset.r==='trabajos')));
  if(lenis) lenis.scrollTo(0,{immediate:true,force:true}); else window.scrollTo(0,0);
  bindTrabajos(); if(!booting) animatePage(v); $('#lp').classList.remove('on');
  $('#top').onclick=()=>scrollTo(0);
}
function go(first){
  const r=resolve();
  if(r.anchor){scrollTo(r.anchor);return;}
  if(r.key===current) return;
  if(first||!ANIM){render(r);return;}
  if(moving) return; moving=true;
  closeMenu();
  G.timeline({onComplete:()=>{moving=false}})
    .to(['#view','#ft'],{opacity:0,duration:.35,ease:'power2.in'})
    .add(()=>render(r))
    .to(['#view','#ft'],{opacity:1,duration:.5,ease:'power2.out'},'+=.05');
}
addEventListener('hashchange',()=>go(false));
/* control de los ojos del símbolo: mirar, parpadear, abrir y cerrar */
function eyeCtl(svg){
  const eyes=[...svg.querySelectorAll('.beye')], pups=[...svg.querySelectorAll('.bpup')];
  const setT=(el,v)=>el.setAttribute('transform',v);
  const io=p=>p<.5?2*p*p:1-(-2*p+2)**2/2, oc=p=>1-(1-p)**3, ic=p=>p*p*p;
  let cur={x:0,y:0}, lid=1;
  const setLid=v=>{lid=v;eyes.forEach(g=>{const cy=+g.dataset.cy;if(v>=.999)g.removeAttribute('transform');else setT(g,`translate(0 ${cy}) scale(1 ${Math.max(.02,v).toFixed(3)}) translate(0 ${-cy})`);});};
  const tween=(d,fn)=>new Promise(res=>{const t0=performance.now();const f=now=>{const p=Math.min(1,(now-t0)/d);fn(p);if(p<1)requestAnimationFrame(f);else res();};requestAnimationFrame(f);});
  const look=(x,y,d=420)=>{const fr={...cur};return tween(d,p=>{const e=io(p);cur={x:fr.x+(x-fr.x)*e,y:fr.y+(y-fr.y)*e};pups.forEach(g=>setT(g,`translate(${cur.x.toFixed(1)} ${cur.y.toFixed(1)})`));});};
  const lidTo=(v,d,ease=oc)=>{const fr=lid;return tween(d,p=>setLid(fr+(v-fr)*ease(p)));};
  const blink=async(d=240)=>{await lidTo(.03,d*.42,ic);await lidTo(1,d*.58,oc);};
  return {look,blink,lidTo,setLid};
}
/* símbolo vivo del header: los ojos miran en distintas direcciones y parpadean */
{const hm=$('.hd .bmark'); if(hm&&!RM){const E=eyeCtl(hm);
 const DIRS=[[0,0],[-34,4],[34,4],[-26,-14],[26,-14],[0,16],[-30,14],[30,14]];
 const loop=async()=>{if(Math.random()<.38)await E.blink(); else {const d=DIRS[Math.random()*DIRS.length|0];await E.look(d[0],d[1]);if(Math.random()<.3){await new Promise(r=>setTimeout(r,260));await E.blink();}}
   setTimeout(loop,1300+Math.random()*2200);};
 setTimeout(loop,6500);}}
/* reloj del estudio: hora de Asunción, 24 h */
{const ck=$('#clock');let fmt;try{fmt=new Intl.DateTimeFormat('es-PY',{timeZone:'America/Asuncion',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});}catch(e){fmt=null;}
 const tick=()=>{const d=new Date();ck.textContent='Asunción '+(fmt?fmt.format(d):d.toTimeString().slice(0,8));};tick();setInterval(tick,1000);}
/* botón de modo: claro → oscuro → flúor */
const MODES=[['light','Claro'],['dark','Oscuro'],['fluor','Flúor']];
const setMode=k=>{const m=MODES.find(x=>x[0]===k)||MODES[0];
  if(m[0]==='light')delete document.documentElement.dataset.mode; else document.documentElement.dataset.mode=m[0];
  $('#modeTxt').textContent=m[1]; try{localStorage.setItem('bolton-mode',m[0]);}catch(e){}};
setMode(document.documentElement.dataset.mode||'light');
$('#mode').onclick=()=>{const cur=document.documentElement.dataset.mode||'light';const i=MODES.findIndex(x=>x[0]===cur);setMode(MODES[(i+1)%MODES.length][0]);shuffle($('#modeTxt'),$('#modeTxt').textContent,350);};
document.addEventListener('click',e=>{
  const s=e.target.closest('[data-scroll]'); if(s){e.preventDefault();const t=document.getElementById(s.getAttribute('href').slice(1));if(t)scrollTo(t);return;}
  const a=e.target.closest('a[href^="#"]'); if(!a) return;
  const h=a.getAttribute('href').slice(1);
  if(h===current){e.preventDefault();closeMenu();scrollTo(0);}
});

/* ===================== menú ===================== */
const ov=$('#ov'), mb=$('#mbtn'); let mOpen=false;
function openMenu(){
  mOpen=true; document.body.classList.add('menu-open'); mb.setAttribute('aria-expanded','true'); $('#mtxt').textContent='Cerrar';
  if(lenis) lenis.stop();
  if(ANIM){G.timeline().fromTo(ov,{clipPath:'inset(0 0 100% 0)'},{clipPath:'inset(0 0 0% 0)',duration:.8,ease:'power4.inOut'})
    .fromTo($$('.line>span',ov),{yPercent:110},{yPercent:0,duration:.9,ease:'expo.out',stagger:.07},'-=.35')
    .fromTo('.ovf',{opacity:0},{opacity:1,duration:.5},'-=.6');}
  else ov.style.clipPath='inset(0 0 0 0)';
}
function closeMenu(fast){
  if(!mOpen) return; mOpen=false; mb.setAttribute('aria-expanded','false'); $('#mtxt').textContent='Menú';
  if(lenis) lenis.start();
  const done=()=>document.body.classList.remove('menu-open');
  if(ANIM&&!fast) G.timeline({onComplete:done}).to($$('.line>span',ov),{yPercent:-110,duration:.5,ease:'power3.in',stagger:.04}).to(ov,{clipPath:'inset(0 0 100% 0)',duration:.7,ease:'power4.inOut'},'-=.2');
  else { if(ANIM) G.delayedCall(.75,()=>{G.set(ov,{clipPath:'inset(0 0 100% 0)'});done();}); else {ov.style.clipPath='';done();} }
}
mb.onclick=()=>mOpen?closeMenu():openMenu();
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});

/* ===================== cursor ===================== */
const cur=$('#cur'), cTxt=$('#curTxt'), lp=$('#lp');
if(matchMedia('(hover:hover)').matches){
  let mx=innerWidth/2,my=innerHeight/2,cx=mx,cy=my,lx=mx,ly=my;
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(!document.getElementById('pre'))cur.classList.add('on');});
  const tick=()=>{cx+=(mx-cx)*.22;cy+=(my-cy)*.22;lx+=(mx-lx)*.12;ly+=(my-ly)*.12;
    cur.style.transform=`translate(${cx}px,${cy}px)`; lp.style.left=lx+'px'; lp.style.top=ly+'px'; requestAnimationFrame(tick);};
  tick();
  document.addEventListener('pointerover',e=>{
    const cd=e.target.closest('.card'); if(cd&&!cd._h){cd._h=1;const sp=$('.meta>span',cd);if(sp){orig(sp);shuffle(sp,'Descubrir');cd.addEventListener('pointerleave',()=>{cd._h=0;shuffle(sp);},{once:true});}}
    const nv=e.target.closest('.nav a'); if(nv&&!nv._h){nv._h=1;shuffle(nv,undefined,380);nv.addEventListener('pointerleave',()=>nv._h=0,{once:true});}
    const big=e.target.closest('[data-cursor]'), lk=e.target.closest('a,button,[data-cursor-link]');
    cur.classList.toggle('big',!!big); cTxt.textContent=big?big.dataset.cursor:'';
    cur.classList.toggle('link',!big&&!!lk);
  });
} else document.body.classList.remove('has-cur');

/* ===================== preloader + arranque ===================== */
go(true);
if(ANIM){
  const pre=$('#pre'), o=asciiCanvas(pre); o.cv.remove(); o.cv=$('#preCv'); o.ctx=o.cv.getContext('2d'); o.size=(()=>{const f=o.size;return ()=>{const w=innerWidth,h=innerHeight,d=Math.min(2,devicePixelRatio||1);o.cv.width=w*d;o.cv.height=h*d;o.ctx.setTransform(d,0,0,d,0,0);o.w=w;o.h=h;o.cols=Math.ceil(w/o.cell);o.rows=Math.ceil(h/o.cell);o.n=o.cols*o.rows;o.ch=Array.from({length:o.n},rch);o.font();}})(); o.size();
  /* racimos de caracteres grises que parpadean sobre negro */
  let on=new Set(), alive=true;
  const seed=()=>{const c=Math.random()*o.cols|0,r=Math.random()*o.rows|0,n=2+Math.random()*7|0;for(let k=0;k<n;k++){const cc=c+(Math.random()*3|0)-1+(k%3),rr=r+(k/3|0)+(Math.random()<.3?1:0);if(cc>=0&&cc<o.cols&&rr>=0&&rr<o.rows)on.add(rr*o.cols+cc);}};
  const cssv=k=>getComputedStyle(document.documentElement).getPropertyValue(k).trim();
  const flick=()=>{if(!alive)return;o.ctx.fillStyle=cssv('--bg')||'#f7f7f7';o.ctx.fillRect(0,0,o.w,o.h);
    if(Math.random()<.6)seed(); on.forEach(i=>{if(Math.random()<.12)on.delete(i);else{if(Math.random()<.3)o.ch[i]=rch();o.ctx.fillStyle=cssv('--mute')||'#b8b8b8';o.ctx.fillText(o.ch[i],(i%o.cols)*o.cell+o.cell/2,(i/o.cols|0)*o.cell+o.cell/2+.5);}});
    setTimeout(()=>requestAnimationFrame(flick),70);};
  pre.style.background='transparent'; flick();
  /* intro: el símbolo de Bolton abre los ojos, mira a los costados y parpadea; luego la página se desliza */
  const pm=$('#pmark'); pm.innerHTML=$('.hd .bmark').outerHTML.replace(/id="(b\w+)"/g,'id="p$1"').replace(/url\(#(b\w+)\)/g,'url(#p$1)');
  const mk=$('.bmark',pm), E=eyeCtl(mk), wait=ms=>new Promise(r=>setTimeout(r,ms));
  E.setLid(.03);
  const hl=$('.hd .bmark'); hl.style.opacity='0';
  const c={v:0}, TOTAL=4.4;
  G.to(c,{v:100,duration:TOTAL,ease:'power1.inOut',onUpdate:()=>$('#cnt').textContent=String(Math.round(c.v)).padStart(3,'0')});
  if(lenis) lenis.stop();
  (async()=>{
    G.fromTo(mk,{opacity:0,scale:.86,y:14},{opacity:1,scale:1,y:0,duration:.8,ease:'power3.out'});
    await wait(420);
    await E.lidTo(1,420);                 /* abre los ojos */
    await wait(260);
    await E.look(-34,4,430); await wait(330);   /* mira a la izquierda */
    await E.look(34,4,560);  await wait(260);   /* cruza a la derecha */
    await E.blink(230);
    await E.look(-22,-14,360); await wait(180); /* mira arriba */
    await E.look(0,0,380);   await wait(120);   /* vuelve al centro */
    await E.blink(190); await wait(90); await E.blink(190);  /* doble parpadeo */
    await wait(220);
    alive=false; G.to('#cnt',{opacity:0,duration:.25});
    o.ctx.fillStyle=cssv('--bg')||'#f7f7f7';o.ctx.fillRect(0,0,o.w,o.h);
    /* el símbolo sale del telón y viaja a su lugar en el header, donde se queda */
    const from=mk.getBoundingClientRect(), to=hl.getBoundingClientRect();
    const fl=document.createElement('div'); fl.className='flyer';
    Object.assign(fl.style,{left:from.left+'px',top:from.top+'px',width:from.width+'px',height:from.height+'px'});
    G.set(mk,{clearProps:'transform'}); mk.style.opacity='1'; fl.appendChild(mk); document.body.appendChild(fl);
    if(lenis) lenis.start();
    booting=false; animatePage($('#view'));
    G.to(pre,{yPercent:-100,duration:1.1,ease:'power4.inOut',onComplete:()=>pre.remove()});
    G.to(fl,{left:to.left,top:to.top,width:to.width,height:to.height,duration:1.1,ease:'power4.inOut',
      onComplete:()=>{hl.style.opacity='';fl.remove();}});
  })();
} else { const pr=$('#pre'); if(pr) pr.remove(); }
}
